name: validate-worksheets

on:
  push:
    paths: ["data/**", "scripts/**", "**.html"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 문제지·manifest·study-plan 검사
        run: python scripts/validate_worksheets.py --quiet
